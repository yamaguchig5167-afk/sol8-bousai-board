<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>防災ボード</title>
<script>
// 防災ボードは新しいアドレスへ移りました。同じページ名・同じ ? と # を付けて送ります。
(function () {
  var BASE = 'https://sol8-bousai-board.vercel.app';
  var path = location.pathname.replace(/^\/sol8-bousai-board/, '') || '/';
  var hash = location.hash;
  // この端末に事業所の設定が残っていれば、新しいアドレスへ引きつぐ（ライフラインの記録は入れない）
  if (!hash) {
    try {
      var s = JSON.parse(localStorage.getItem('bousai-board-v1') || 'null');
      if (s && typeof s === 'object') {
        var o = {}, keys = ['name', 'addr', 'lat', 'lon', 'muni', 'muniName', 'meet', 'contacts'];
        for (var i = 0; i < keys.length; i++) o[keys[i]] = s[keys[i]];
        var bytes = new TextEncoder().encode(JSON.stringify(o)), bin = '';
        for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
        hash = '#s=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
    } catch (e) { /* 読めない端末は、設定なしで送る */ }
  }
  location.replace(BASE + path + location.search + hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://sol8-bousai-board.vercel.app/"></noscript>
<style>body{font-family:"Noto Sans JP",sans-serif;margin:2rem;color:#0A1128;line-height:1.8}a{color:#17365D}</style>
</head>
<body>
<p>防災ボードは、新しいアドレスへ移りました。<br>
自動で切りかわらないときは、こちらを開いてください。<br>
<a href="https://sol8-bousai-board.vercel.app/">https://sol8-bousai-board.vercel.app/</a></p>
</body>
</html>
